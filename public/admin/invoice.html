<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice detail — GRD Virk Pty Ltd</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<div class="topbar">
  <div class="titles-group">
    <div class="brand-mark">GV</div>
    <div class="titles">
    <span class="brand">GRD Virk Pty Ltd</span>
    <h1>Invoice</h1>
  </div>
  </div>
  <div class="topbar-links">
    <a href="/admin/">Back</a>
  </div>
</div>
<div class="page">
  <div id="error"></div>
  <div id="notice"></div>
  <div id="content">Loading…</div>
</div>
<script src="/assets/app.js"></script>
<script>
const invoiceId = new URLSearchParams(window.location.search).get("id");
let invoice, items;

function computeTotals(daysWorked, dailyRateInclGst, items) {
  let taxable = Number(daysWorked || 0) * Number(dailyRateInclGst || 0);
  let nonGst = 0;
  for (const item of items) {
    const amt = Number(item.amount) || 0;
    if (item.gst_treatment === "gst_included") taxable += amt; else nonGst += amt;
  }
  taxable = Math.round(taxable * 100) / 100;
  const gst = Math.round((taxable / 11) * 100) / 100;
  const subtotal = Math.round((taxable - gst) * 100) / 100;
  nonGst = Math.round(nonGst * 100) / 100;
  const total = Math.round((taxable + nonGst) * 100) / 100;
  return { taxable_subtotal_excl_gst: subtotal, gst_amount: gst, non_gst_total: nonGst, total_payable: total };
}

function render() {
  const content = document.getElementById("content");
  const subName = invoice.subcontractors ? (invoice.subcontractors.business_name || invoice.subcontractors.legal_name) : "";

  const actionButtons = [];
  if (invoice.status === "submitted") {
    actionButtons.push(`<button class="btn secondary" data-action="review">Mark under review</button>`);
  }
  if (["submitted", "under_review"].includes(invoice.status)) {
    actionButtons.push(`<button class="btn" data-action="approve">Approve</button>`);
    actionButtons.push(`<button class="btn secondary" data-action="return">Return for correction</button>`);
    actionButtons.push(`<button class="btn danger" data-action="reject">Reject</button>`);
  }
  if (invoice.status === "approved") {
    actionButtons.push(`<button class="btn" data-action="paid">Mark paid</button>`);
  }
  if (!["paid", "cancelled"].includes(invoice.status)) {
    actionButtons.push(`<button class="btn danger" data-action="cancel">Cancel invoice</button>`);
  }
  actionButtons.push(`<button class="btn danger" data-action="delete">Delete permanently</button>`);

  content.innerHTML = `
    <div class="card">
      <div class="row" style="align-items:center;">
        <h2 style="margin:0;">${invoice.invoice_number || "Draft"}</h2>
        <span class="badge ${invoice.status}">${statusLabel(invoice.status)}</span>
      </div>
      <p class="muted">${subName}</p>
      ${invoice.correction_requested ? `<div class="notice-box">The subcontractor has requested a correction${invoice.correction_note ? ": " + invoice.correction_note : ""}.</div>` : ""}
      <a class="btn secondary" href="/api/admin/invoices/${invoice.id}/pdf" target="_blank">Download PDF</a>
    </div>

    <div class="card">
      <h3>Work period</h3>
      <div class="row">
        <div><label>Start</label><input id="period_start" type="date" value="${invoice.period_start}" /></div>
        <div><label>End</label><input id="period_end" type="date" value="${invoice.period_end}" /></div>
      </div>
      <label>Days worked</label>
      <input id="days_worked" type="number" step="0.5" value="${invoice.days_worked}" />
      <label>Daily rate (GST included)</label>
      <input id="daily_rate_incl_gst" type="number" step="0.01" value="${invoice.daily_rate_incl_gst}" />
      <label>Depot</label>
      <input id="depot" value="${invoice.depot || ""}" />
      <label>Description</label>
      <textarea id="description">${invoice.description || ""}</textarea>
    </div>

    <div class="card">
      <h3>Extra items</h3>
      <div id="items"></div>
      <button class="btn secondary" type="button" id="addItem">+ Add item</button>
    </div>

    <div class="card">
      <h3>Totals</h3>
      <div id="totals"></div>
    </div>

    <div class="card">
      <label>Administrator note</label>
      <textarea id="admin_note">${invoice.admin_note || ""}</textarea>
      <button class="btn" id="saveEdits">Save changes</button>
    </div>

    <div class="card">
      <h3>Actions</h3>
      ${actionButtons.join(" ")}
    </div>

    <div class="card">
      <h3>Change history</h3>
      <div id="history" class="muted">Loading…</div>
    </div>
  `;

  items = invoice.invoice_items.map((i) => ({ description: i.description, amount: i.amount, gst_treatment: i.gst_treatment }));
  renderItems();
  updateTotals();

  document.getElementById("addItem").addEventListener("click", () => {
    items.push({ description: "", amount: "", gst_treatment: "gst_included" });
    renderItems(); updateTotals();
  });
  document.getElementById("period_start").addEventListener("change", updateTotals);
  document.getElementById("period_end").addEventListener("change", updateTotals);
  document.getElementById("days_worked").addEventListener("input", updateTotals);
  document.getElementById("daily_rate_incl_gst").addEventListener("input", updateTotals);
  document.getElementById("saveEdits").addEventListener("click", saveEdits);

  loadHistory();
}

function renderItems() {
  const wrap = document.getElementById("items");
  wrap.innerHTML = "";
  items.forEach((item, i) => {
    const row = el(`
      <div class="extra-item">
        <button type="button" class="remove">Remove</button>
        <label>Description</label>
        <input class="d" data-i="${i}" value="${item.description || ""}" />
        <label>Amount</label>
        <input class="a" data-i="${i}" type="number" step="0.01" value="${item.amount ?? ""}" />
        <label>GST</label>
        <select class="g" data-i="${i}">
          <option value="gst_included" ${item.gst_treatment==="gst_included"?"selected":""}>GST included</option>
          <option value="no_gst" ${item.gst_treatment==="no_gst"?"selected":""}>No GST</option>
        </select>
      </div>
    `);
    row.querySelector(".remove").addEventListener("click", () => { items.splice(i,1); renderItems(); updateTotals(); });
    row.querySelector(".d").addEventListener("input", (e) => item.description = e.target.value);
    row.querySelector(".a").addEventListener("input", (e) => { item.amount = e.target.value; updateTotals(); });
    row.querySelector(".g").addEventListener("change", (e) => { item.gst_treatment = e.target.value; updateTotals(); });
    wrap.appendChild(row);
  });
}

function updateTotals() {
  const days = Number(document.getElementById("days_worked").value || 0);
  const rate = Number(document.getElementById("daily_rate_incl_gst").value || 0);
  const totals = computeTotals(days, rate, items);
  document.getElementById("totals").innerHTML = `
    <div class="totals-line"><span>Taxable subtotal (ex GST)</span><span>${money(totals.taxable_subtotal_excl_gst)}</span></div>
    <div class="totals-line"><span>GST</span><span>${money(totals.gst_amount)}</span></div>
    <div class="totals-line"><span>Non-GST items</span><span>${money(totals.non_gst_total)}</span></div>
    <div class="totals-line total"><span>Total payable</span><span>${money(totals.total_payable)}</span></div>
  `;
}

async function saveEdits() {
  const errorBox = document.getElementById("error");
  errorBox.innerHTML = "";
  try {
    const payload = {
      period_start: document.getElementById("period_start").value,
      period_end: document.getElementById("period_end").value,
      days_worked: Number(document.getElementById("days_worked").value),
      daily_rate_incl_gst: Number(document.getElementById("daily_rate_incl_gst").value),
      depot: document.getElementById("depot").value,
      description: document.getElementById("description").value,
      admin_note: document.getElementById("admin_note").value,
      items: items.map((i) => ({ description: i.description, amount: Number(i.amount || 0), gst_treatment: i.gst_treatment })),
    };
    const res = await api.patch(`/admin/invoices/${invoice.id}`, payload);
    invoice = res.invoice;
    document.getElementById("notice").innerHTML = '<div class="success-box">Saved.</div>';
    render();
  } catch (err) {
    showError(errorBox, err.message);
  }
}

async function handleAction(e) {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const errorBox = document.getElementById("error");
  errorBox.innerHTML = "";

  if (action === "delete") {
    if (!confirm("Permanently delete this invoice? This cannot be undone.")) return;
    const pinBody = promptPin("this invoice");
    if (!pinBody) return;
    try {
      await api.delete(`/admin/invoices/${invoice.id}`, pinBody);
      window.location.href = "/admin/";
    } catch (err) {
      showError(errorBox, err.message);
    }
    return;
  }

  if (!["review","approve","return","reject","cancel","paid"].includes(action)) return;
  try {
    let note;
    if (["return","reject","cancel"].includes(action)) {
      note = prompt("Optional note for the subcontractor / record:") || "";
    }
    const res = await api.post(`/admin/invoices/${invoice.id}/${action}`, note !== undefined ? { note } : {});
    invoice = res.invoice;
    const full = await api.get(`/admin/invoices/${invoice.id}`);
    invoice = full.invoice;
    render();
  } catch (err) {
    showError(errorBox, err.message);
  }
}

async function loadHistory() {
  try {
    const { revisions } = await api.get(`/admin/invoices/${invoice.id}/revisions`);
    const box = document.getElementById("history");
    if (revisions.length === 0) {
      box.textContent = "No edits recorded yet.";
      return;
    }
    box.innerHTML = revisions.map((r) => `${new Date(r.created_at).toLocaleString()} — ${r.changed_by}: ${r.change_note || ""}`).join("<br>");
  } catch (err) { /* non-critical */ }
}

(async () => {
  try {
    await requireRole("admin");
    document.getElementById("content").addEventListener("click", handleAction);
    const res = await api.get(`/admin/invoices/${invoiceId}`);
    invoice = res.invoice;
    render();
  } catch (err) {
    if (err.message !== "redirecting") showError(document.getElementById("error"), err.message);
  }
})();
</script>
</body>
</html>
